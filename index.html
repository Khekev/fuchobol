
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Partidos y estadísticas de la Selección Mexicana en la Copa Mundial FIFA 2026.">
    <title>México | FIFA World Cup 2026</title>

    <style>
        :root {
            --bg: #080d12;
            --panel: #111a22;
            --panel2: #17232d;
            --text: #f3f6f8;
            --muted: #a9b6c2;
            --green: #087f50;
            --green2: #13b879;
            --line: #293744;
            --red: #e05252;
            --yellow: #f2c94c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #142b28 0, var(--bg) 42%);
            color: var(--text);
            font-family: system-ui, Arial, sans-serif;
        }

        header {
            padding: 42px 20px 30px;
            text-align: center;
            border-bottom: 1px solid var(--line);
        }

        .eyebrow {
            color: #65dba9;
            font-size: .78rem;
            font-weight: 800;
            letter-spacing: .2em;
            text-transform: uppercase;
        }

        h1 {
            margin: 10px 0 8px;
            font-size: clamp(2rem, 6vw, 3.6rem);
            letter-spacing: -.04em;
        }

        header p {
            margin: 0;
            color: var(--muted);
        }

        main {
            width: min(1100px, calc(100% - 32px));
            margin: 30px auto 60px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .toolbar p {
            color: var(--muted);
            margin: 0;
        }

        button {
            border: 0;
            border-radius: 9px;
            background: var(--green2);
            color: #04150e;
            font-weight: 800;
            padding: 12px 18px;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.08);
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #status {
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--panel);
            color: var(--muted);
            margin-bottom: 20px;
        }

        #status.error {
            color: #ffb4b4;
            border-color: #733c3c;
        }

        #matches {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr));
            gap: 18px;
        }

        .match-card {
            background: linear-gradient(145deg, var(--panel2), var(--panel));
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 12px 30px #0003;
        }

        .match-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            color: var(--muted);
            font-size: .82rem;
        }

        .group {
            color: #70d9aa;
            font-weight: 800;
        }

        .scoreboard {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            text-align: center;
        }

        .team {
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .team small {
            display: block;
            color: var(--muted);
            font-weight: 500;
            margin-top: 5px;
        }

        .score {
            font-size: 2rem;
            font-weight: 900;
            white-space: nowrap;
        }

        .details {
            color: var(--muted);
            font-size: .9rem;
            line-height: 1.7;
            border-top: 1px solid var(--line);
            padding-top: 12px;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .pill {
            background: #22313d;
            border-radius: 30px;
            padding: 6px 10px;
            font-size: .8rem;
        }

        .pill.yellow::before {
            content: "amarilla ";
        }

        .pill.red::before {
            content: "roja ";
        }

        .pill.goal::before {
            content: " ";
        }

        .events {
            margin-top: 16px;
            border-top: 1px solid var(--line);
            padding-top: 12px;
        }

        .events h3 {
            font-size: .9rem;
            margin: 0 0 8px;
        }

        .events ul {
            margin: 0;
            padding-left: 18px;
            color: var(--muted);
            font-size: .85rem;
            line-height: 1.7;
        }

        .empty {
            grid-column: 1 / -1;
            padding: 28px;
            border: 1px dashed var(--line);
            border-radius: 12px;
            color: var(--muted);
            text-align: center;
        }

        footer {
            text-align: center;
            color: var(--muted);
            padding: 25px;
            font-size: .8rem;
            border-top: 1px solid var(--line);
        }

        @media (max-width: 480px) {
            header {
                padding-top: 30px;
            }

            .score {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="eyebrow">
            FIFA World Cup 2026 · Grupo A
        </div>

        <h1>🇲🇽 México Tracker</h1>

        <p>
            Partidos, marcadores y eventos de la Selección Mexicana
        </p>
    </header>

    <main>

        <section class="toolbar" aria-label="Controles">

            <p>
                Información consultada desde la API pública de FIFA.
            </p>

            <button id="reloadButton" type="button">
                Actualizar partidos
            </button>

        </section>

        <div id="status" role="status" aria-live="polite">
            Preparando consulta...
        </div>

        <section id="matches" aria-label="Partidos de México">

            <div class="empty">
                Cargando partidos de México…
            </div>

        </section>

    </main>

    <footer>
        Amerike
    </footer>

    <script src="app.js"></script>

</body>
</html>
